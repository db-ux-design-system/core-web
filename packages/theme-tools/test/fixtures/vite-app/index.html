<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>theme-tools vite fixture</title>
		<script type="module" src="/src/main.js"></script>
	</head>
	<body>
		<!--
			Minimal usage surface for the detector. No component packages — just
			bare elements carrying the adaptive data-attributes the plugin scans.
			Only these colors/materials should survive optimization (plus the
			always-kept baseline: grey + filled-1).
		-->
		<div data-adaptive-color="blue" data-material="filled-3">Blue surface</div>
		<button data-adaptive-color="green" data-material="vibrant">Green action</button>
		<span data-alt-state-adaptive-color="blue">Alt-state blue</span>
	</body>
</html>
