---
name: Dependabot review

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:

jobs:
  review:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Prepare dependency review prompt
        uses: mfranzke/dependabot-review-action@v0.2.1
        with:
          github-token: ${{ github.token }}
