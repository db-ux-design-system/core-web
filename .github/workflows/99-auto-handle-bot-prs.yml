---
# Auto-handle bot pull requests
#
# One place for both dependency bots:
#   - Dependabot: auto-merge for every PR, auto-approval for patch bumps
#     (update type comes from `dependabot/fetch-metadata`).
#   - Renovate: auto-merge is switched on by Renovate itself, scoped to pnpm
#     patch releases in `.github/renovate.json`. This job only supplies the
#     approving review, which is the actual gate -- auto-merge can never merge
#     without it.
#     Because that review lifts the review requirement, it must not be granted
#     on trust in metadata: labels, PR titles, branch names and "auto-merge is
#     enabled" can all be set by anybody with write access. So the review is
#     granted based on the diff, and only for the one change that is safe by
#     construction: nothing but the `packageManager` field of the root
#     package.json. Which of those PRs may then merge unattended (patch, not
#     minor or major) is Renovate's decision.
#
# In both cases auto-merge still waits for all required status checks, and the
# approving review is submitted by `github-actions[bot]` -- a different identity
# than the bot that opened the PR, because GitHub does not allow approving your
# own pull request.

name: Bot PR auto-handle

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:

jobs:
  dependabot:
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 explicitly
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: ⏬ Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: ✔ Approve a PR
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: 🐛 Debug update-type output
        run: echo "Update type is '${{ steps.metadata.outputs.update-type }}'"

      # Auto-merge is safe for all Dependabot PRs because the required
      # approval gate still prevents merging without a human review.
      - name: 🤖 Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  renovate:
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 explicitly
    # A bot-authored PR on a `renovate-` branch of this repository. This only
    # narrows down which PRs are inspected -- whether the review is granted is
    # decided by the diff below.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'renovate-')
    steps:
      - name: ⏬ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fails closed: everything but a pure `packageManager` change leaves
      # `verified` false, so the PR waits for a human instead of turning the
      # pipeline red.
      - name: 🔍 Verify the PR changes nothing but packageManager
        id: verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          verified=false
          if [[ "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" == "package.json" ]] &&
            diff -q \
              <(git show "$BASE_SHA:package.json" | jq -S "del(.packageManager)") \
              <(git show "$HEAD_SHA:package.json" | jq -S "del(.packageManager)"); then
            verified=true
          fi
          echo "packageManager-only change: $verified"
          echo "verified=$verified" >> $GITHUB_OUTPUT

      - name: ✔ Approve a PR
        if: ${{ steps.verify.outputs.verified == 'true' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
