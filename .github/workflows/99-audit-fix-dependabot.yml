---
# Audit Fix for Dependabot PRs
#
# Runs `pnpm audit --fix` on dependabot PRs to opportunistically resolve known
# vulnerabilities beyond what the current PR addresses.
#
# We use `--fix` (overrides mode), NOT `--fix=update`. `--fix` writes targeted
# `overrides` (and, when minimumReleaseAge is set, `minimumReleaseAgeExclude`
# entries) to pnpm-workspace.yaml that pin only the vulnerable packages to their
# minimum patched version. This is deterministic. `--fix=update` instead bumps
# versions in the lockfile and opportunistically drags in unrelated patch churn
# (e.g. electron-to-chromium, released almost daily), which caused an endless
# auto-commit loop that re-triggered the whole pipeline on runs that fixed
# nothing.
#
# We commit/push (to re-trigger the pipeline) ONLY when `--fix` actually added
# overrides, i.e. when pnpm-workspace.yaml changed. On runs where nothing new is
# fixable, `--fix` writes nothing and we skip the commit, breaking the loop.
# Runs after `init` to reuse the pnpm cache and avoid blocking the pipeline start.

name: Audit fix (Dependabot)

on:
  workflow_call:

jobs:
  audit-fix:
    name: Audit fix
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⏬ Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: 🔄 Init Cache
        uses: ./.github/actions/pnpm-cache
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      - name: 🔒 Run pnpm audit --fix
        run: pnpm audit --fix --ignore-unfixable || true

      - name: 🔍 Check whether new overrides were added
        id: audit
        run: |
          # `--fix` writes overrides / minimumReleaseAgeExclude entries to
          # pnpm-workspace.yaml only when it finds a fixable advisory. If that
          # file is unchanged, nothing was fixable this run, so we skip the
          # sync + commit entirely. This is the loop-breaker: no fix, no commit.
          if git diff --quiet -- pnpm-workspace.yaml; then
            echo "No new overrides added; nothing to fix. Skipping."
            echo "fixed=false" >> $GITHUB_OUTPUT
          else
            echo "audit --fix added overrides to pnpm-workspace.yaml."
            echo "fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Sync lockfile
        if: ${{ steps.audit.outputs.fixed == 'true' }}
        run: pnpm install --no-frozen-lockfile

      - name: 🎨 Format changed files
        if: ${{ steps.audit.outputs.fixed == 'true' }}
        run: pnpm exec prettier --write pnpm-workspace.yaml

      - name: 📝 Commit and push changes
        if: ${{ steps.audit.outputs.fixed == 'true' }}
        uses: ./.github/actions/auto-commit
        with:
          branch-name: "${{ github.head_ref }}-audit-fix"
          commit-message: "fix: resolve additional audit vulnerabilities"
          commit-files: "."
          auto-merge-client-id: ${{ vars.AUTO_MERGE_CLIENT_ID }}
          auto-merge-private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
