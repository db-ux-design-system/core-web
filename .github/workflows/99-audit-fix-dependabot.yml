---
# Audit Fix for Dependabot PRs
#
# Runs `pnpm audit --fix=update` on dependabot PRs to opportunistically resolve
# additional known vulnerabilities beyond what the current PR addresses.
# If the lockfile changes, commits and pushes directly to the PR branch.
# Runs after `init` to reuse the pnpm cache and avoid blocking the pipeline start.

name: Audit fix (Dependabot)

on:
  workflow_call:

jobs:
  audit-fix:
    name: Audit fix
    # if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: ⏬ Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: 🔄 Init Cache
        uses: ./.github/actions/pnpm-cache
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      - name: 🔒 Run pnpm audit --fix=update
        run: pnpm audit --fix=update || true

      - name: 📦 Sync lockfile
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Commit and push changes
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: ./.github/actions/auto-commit
        with:
          branch-name: "${{ github.head_ref }}-audit-fix"
          commit-message: "fix: resolve additional audit vulnerabilities"
          commit-files: "."
          auto-merge-client-id: ${{ vars.AUTO_MERGE_CLIENT_ID }}
          auto-merge-private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
