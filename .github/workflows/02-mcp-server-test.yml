---
name: MCP Server Test

permissions:
  contents: read

on:
  workflow_call:

jobs:
  test-mcp-server:
    name: Test MCP Server
    runs-on: ubuntu-24.04
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔄 Init Cache
        uses: ./.github/actions/pnpm-cache
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      # The mcp-server build generates assets/tokens/tokens.json from the density
      # class overrides in the foundations build output.
      - name: ⏬ Download foundations build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-foundations-build
          path: packages/foundations/build

      # The generated manifest.json embeds the framework example code from output/.
      - name: ⏬ Download output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-output
          path: output

      # Runs `build` first (prebuild + manifest + esbuild bundle), then vitest:
      # unit, integration and the stdio E2E suite, which spawns the real server
      # and connects on both protocol eras.
      - name: 🧪 Run MCP Server Tests
        run: pnpm --filter @db-ux/mcp-server run test
