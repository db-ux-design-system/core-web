---
name: On-PR to main

on:
  pull_request:
    branches: ["main"]

jobs:
  bot-prs:
    uses: $/.github/workflows/99-auto-handle-bot-prs.yml

  dependency-review:
    uses: $/.github/workflows/99-dependency-review.yml

  dependabot-review:
    uses: $/.github/workflows/99-dependabot-review.yml

  labeler:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/99-labeler.yml

  # Safety net of 99-refresh-platform-components.yml: the release PR fails
  # when the Storybook overview pages would ship an outdated copy of the
  # platform data. Merge the open "refresh platform-components.json" PR (or
  # run the workflow) to fix it.
  platform-components:
    if: startsWith(github.head_ref, 'changeset-release/')
    name: 🧭 Platform components up to date
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: 🔎 Compare with the platform
        run: node storybooks/_shared/overview/update-platform-components.ts --check
