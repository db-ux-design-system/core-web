---
name: On-PR to main

on:
  pull_request:
    branches: ["main"]

# We'd like to run the pipeline for Dependabot PRs sequentially, and all other PRs in parallel, but still only one action run for each PR.
# TODO: We won't need this anymore as soon as we get Merge Groups and could remove the concurrency again, which currently brings us pain regarding unstarted, non-self-healing dependabot pipelines
# NOTE: Concurrency is disabled for release events as they should always run to completion
# NOTE: All Dependabot runs share a single global 'dependabot' concurrency group ON PURPOSE. Dependabot PRs merge into main sequentially, and every PR must be validated against the latest main. Serializing them globally means that once one Dependabot PR merges, the others re-run against the updated main instead of passing on a stale base. The group is intentionally NOT namespaced per workflow or per ref, because that would let two different Dependabot PRs (or the same PR's Default/On-PR/CodeQL workflows) run in parallel and go stale relative to each other.
concurrency:
  # Creates a unique concurrency group identifier for release events using the git reference
  group: >-
    ${{
      github.event_name == 'release' &&
      format('release-{0}', github.ref) ||
      github.actor == 'dependabot[bot]' &&
      'dependabot' ||
      format('{0}-{1}', github.workflow, github.ref)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'release' &&
      github.actor != 'dependabot[bot]' &&
      github.ref != 'refs/heads/main'
    }}

permissions:
  pull-requests: write
  contents: write
  actions: read
  security-events: write

jobs:
  bot-prs:
    uses: ./.github/workflows/99-auto-handle-bot-prs.yml

  dependency-review:
    uses: ./.github/workflows/99-dependency-review.yml

  dependabot-review:
    uses: ./.github/workflows/99-dependabot-review.yml

  labeler:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/99-labeler.yml
