name: Cancel Workflow

permissions:
  contents: read
  pull-requests: write
  actions: write

on:
  workflow_call:

jobs:
  cancel-workflow:
    name: Cancel Workflow
    runs-on: ubuntu-26.04
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@v7.0.1

      - name: 💀 Killing me softly
        run: |
          gh run cancel ${{ github.run_id }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
