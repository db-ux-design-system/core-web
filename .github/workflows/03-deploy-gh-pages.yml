---
name: Deploy to gh-pages

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release:
        required: false
        default: "false"
        type: string
      preRelease:
        required: false
        default: "false"
        type: string
      name:
        description: "Branch or Tag name"
        required: true
        type: string
      repoName:
        description: "Repository name"
        required: true
        type: string
      repoOwner:
        description: "Repository owner"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 explicitly
    permissions:
      contents: write
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only Node is needed here (no pnpm install): the deploy script has no
      # runtime dependencies and just assembles this branch's subtree. .nvmrc
      # pins Node 26, which executes the TypeScript script natively.
      - name: 🆙 Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: ⏬ Download patternhub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-patternhub
          path: build-showcases/patternhub

      - name: ⏬ Download composition-storybook
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-composition-storybook
          path: build-storybooks/composition-storybook

      - name: ⏬ Download angular-storybook
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-angular-storybook
          path: build-storybooks/angular-storybook

      - name: ⏬ Download react-storybook
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-react-storybook
          path: build-storybooks/react-storybook

      - name: ⏬ Download vue-storybook
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-vue-storybook
          path: build-storybooks/vue-storybook

      - name: ⏬ Download html-storybook
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: db-ux-html-storybook
          path: build-storybooks/html-storybook

      - name: 🦵🦿 I like to move it move it
        shell: bash
        run: |
          mv build-showcases/patternhub out
          mv build-storybooks/composition-storybook out/composition-storybook
          mv build-storybooks/angular-storybook out/angular-storybook
          mv build-storybooks/html-storybook out/html-storybook
          mv build-storybooks/react-storybook out/react-storybook
          mv build-storybooks/vue-storybook out/vue-storybook

      # Compute which gh-pages subdirectory this deploy owns (review/<branch>,
      # version/<name>, or version/latest for a release). Publishing into a
      # dedicated destination_dir lets the action replace exactly that subtree
      # while leaving every sibling (other previews/versions) untouched.
      - name: 🧭 Resolve destination dir
        id: dest
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          PRE_RELEASE: ${{ inputs.preRelease }}
          NAME: ${{ inputs.name }}
        run: |
          if [[ "$RELEASE" == "true" || "$PRE_RELEASE" == "true" ]]; then
            echo "dir=version/${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=review/${NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Replace this branch's/version's subtree. keep_files defaults to false, so
      # files deleted from the build (removed pages/routes) are removed from the
      # subtree too, fixing stale-file retention. destination_dir scopes the
      # action to just this subdir, so unrelated subtrees are preserved.
      - name: 🥅 Deploy to GH-Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: ${{ steps.dest.outputs.dir }}

      # On a full release, also refresh version/latest as its own owned subtree.
      - name: 🥅 Deploy latest to GH-Pages
        if: ${{ inputs.release == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: version/latest

      # Generate the root redirect file (./root-redirect/index.html) for releases.
      - name: 🔨 Build root redirect
        if: ${{ inputs.release == 'true' }}
        env:
          RELEASE: ${{ inputs.release }}
          PRE_RELEASE: ${{ inputs.preRelease }}
          NAME: ${{ inputs.name }}
          REPO_NAME: ${{ inputs.repoName }}
          OWNER_NAME: ${{ inputs.repoOwner }}
        run: |
          node scripts/github/build-gh-page.ts

      # On a full release, refresh the root redirect to version/latest. This is
      # the one file that must sit at the gh-pages root alongside every subtree,
      # so it is published with keep_files: true (merge the single index.html
      # without removing review/ or version/ siblings).
      - name: 🥅 Deploy root redirect to GH-Pages
        if: ${{ inputs.release == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./root-redirect
          keep_files: true

      - name: 🖨️ Print gh-pages url
        env:
          RELEASE: ${{ inputs.release }}
          PRE_RELEASE: ${{ inputs.preRelease }}
          NAME: ${{ inputs.name }}
          REPO_NAME: ${{ inputs.repoName }}
          OWNER_NAME: ${{ inputs.repoOwner }}
        run: |
          if [[ $RELEASE == "true" ]];
          then
            export URL=https://$OWNER_NAME.github.io/$REPO_NAME
          elif [[ $PRE_RELEASE == "true" ]];
          then
            export URL=https://$OWNER_NAME.github.io/$REPO_NAME/version/${NAME}
          else
            export URL=https://$OWNER_NAME.github.io/$REPO_NAME/review/${NAME}
          fi
          echo "URL: $URL"
          echo "### GH-Pages URL :rocket: <br> <br> $URL" >> $GITHUB_STEP_SUMMARY
