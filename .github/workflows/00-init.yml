name: Init Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean
    outputs:
      branchName:
        description: "Branch or Tag name"
        value: ${{ jobs.init.outputs.name }}
      baseUrl:
        description: "Base URL for the repository"
        value: ${{ jobs.init.outputs.baseUrl }}
      repoName:
        description: "Repository name"
        value: ${{ jobs.init.outputs.repoName }}
      repoOwner:
        description: "Repository owner"
        value: ${{ jobs.init.outputs.repoOwner }}
      playwrightVersion:
        description: "Current playwright version"
        value: ${{ jobs.init.outputs.version }}
      test-ally:
        description: "If aria-snapshots are changed"
        value: ${{ jobs.init.outputs.test-ally }}
      isChangesetRelease:
        description: "If this is a changeset release PR"
        value: ${{ jobs.init.outputs.isChangesetRelease }}
      isFork:
        description: "If this is a pull request from a fork or running in a fork repository"
        value: ${{ jobs.init.outputs.isFork }}
      # Preflight outputs (non-release events): the prospective release version/channel,
      # derived from the changeset-versioned manifests so a publish dry-run rehearses
      # the same version and npm tag the real release will use.
      preflightVersion:
        description: "Prospective release version for a publish dry-run"
        value: ${{ jobs.init.outputs.preflightVersion }}
      preflightRelease:
        description: "If the prospective version is a full release"
        value: ${{ jobs.init.outputs.preflightRelease }}
      preflightPreRelease:
        description: "If the prospective version is a pre-release"
        value: ${{ jobs.init.outputs.preflightPreRelease }}
      # Publish outputs
      release:
        description: "If the current tag is a release"
        value: ${{ jobs.publish.outputs.release }}
      preRelease:
        description: "If the current tag is a pre-release"
        value: ${{ jobs.publish.outputs.preRelease }}
      version:
        description: "Which version has the tag"
        value: ${{ jobs.publish.outputs.version }}
jobs:
  init:
    name: Init
    outputs:
      name: ${{ steps.result.outputs.name }}
      baseUrl: ${{ steps.result.outputs.baseUrl }}
      repoName: ${{ steps.result.outputs.repo }}
      repoOwner: ${{ steps.result.outputs.owner }}
      version: ${{ steps.version.outputs.version }}
      test-ally: ${{ steps.ally.outputs.test-ally }}
      isChangesetRelease: ${{ steps.changeset-check.outputs.isChangesetRelease }}
      isFork: ${{ steps.fork-check.outputs.isFork }}
      preflightVersion: ${{ steps.preflight-version.outputs.version }}
      preflightRelease: ${{ steps.preflight-version.outputs.release }}
      preflightPreRelease: ${{ steps.preflight-version.outputs.preRelease }}
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 explicitly
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false

      - name: 🔄 Init Cache Default
        uses: ./.github/actions/pnpm-cache
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      - name: 🛤 Extract name and base
        id: extract-name-and-base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_REF: ${{ github.ref }}
          RELEASE: ${{ inputs.release }}
        with:
          script: |
            const { default: extractNameAndBaseUrl } = await import('${{ github.workspace }}/scripts/github/extract-name-and-base-url.js');
            return extractNameAndBaseUrl(context);

      - name: ✒️ Write to output
        id: result
        env:
          RESULT: ${{ steps.extract-name-and-base.outputs.result }}
        run: |
          echo "name=$(echo $RESULT | jq -r .name)" >> $GITHUB_OUTPUT
          echo "baseUrl=$(echo $RESULT | jq -r .baseUrl)" >> $GITHUB_OUTPUT
          echo "repo=$(echo $RESULT | jq -r .repo)" >> $GITHUB_OUTPUT
          echo "owner=$(echo $RESULT | jq -r .owner)" >> $GITHUB_OUTPUT

      - name: 🪁 Get playwright version
        id: version
        run: |
          OUTPUT=$(pnpm --silent tsx scripts/github/get-playwright-version.ts)
          echo "version=$OUTPUT" >> $GITHUB_OUTPUT

      - name: 👩 Should Test a11y
        id: ally
        shell: bash
        run: |
          ARIA_MAIN=$(pnpm --silent tsx scripts/github/snapshot-changes/check-main-aria.ts)
          echo "test-ally=$ARIA_MAIN"
          echo "test-ally=$ARIA_MAIN" >> $GITHUB_OUTPUT

      - name: 🔄 Check if changeset release PR
        id: changeset-check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && \
             [[ "${{ github.head_ref }}" == changeset-release/* ]] && \
             [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]] && \
             [[ "${{ github.event.pull_request.user.login }}" == "dbux-auto-merge-pr[bot]" ]]; then
            echo "isChangesetRelease=true" >> $GITHUB_OUTPUT
          else
            echo "isChangesetRelease=false" >> $GITHUB_OUTPUT
          fi

      - name: 🍴 Check if fork PR or fork repository
        id: fork-check
        run: |
          # Case 1: Pull request from a fork — the head repo differs from the base repo.
          # This is the most common fork scenario and does not require a hardcoded org name.
          if [[ "${{ github.event_name }}" == "pull_request" ]] && \
             [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "isFork=true" >> $GITHUB_OUTPUT
          # Case 2: Non-PR events (push, workflow_dispatch) running inside a fork repository.
          # The PR head repo check above is empty for these events, so we fall back to an
          # owner check to prevent jobs that require upstream secrets (e.g. Figma) from running.
          elif [[ "${{ github.repository_owner }}" != "db-ux-design-system" ]]; then
            echo "isFork=true" >> $GITHUB_OUTPUT
          else
            echo "isFork=false" >> $GITHUB_OUTPUT
          fi

      # For non-release events the release outputs below are unavailable (the publish job is
      # release-only), so a publish dry-run would otherwise fall back to a fabricated version.
      # foundations is the source of truth: it is always in sync with the other packages, and
      # the changeset release tags `v<that version>` (see scripts/github/changesets/publish.ts).
      # Channel follows the same hyphen rule that scripts/github/package-version.ts enforces.
      - name: 🔖 Derive prospective release version
        id: preflight-version
        run: |
          VERSION=$(node -p "require('./packages/foundations/package.json').version")
          if [[ -z "$VERSION" || "$VERSION" == "undefined" ]]; then
            echo "Could not read version from packages/foundations/package.json"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "preRelease=true" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
            echo "preRelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Prospective release version: $VERSION"

  publish:
    name: Get and save publish version
    runs-on: ubuntu-24.04 # Use Ubuntu 24.04 explicitly
    if: ${{ inputs.release }}
    outputs:
      release: ${{ steps.releaseCheck.outputs.release }}
      preRelease: ${{ steps.releaseCheck.outputs.preRelease }}
      version: ${{ steps.getVersion.outputs.version }}
    steps:
      - name: ⏬ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔄 Init Cache
        uses: ./.github/actions/pnpm-cache
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      - name: 💃🕺 Check if release or prerelease
        id: releaseCheck
        run: |
          OUTPUT=$(pnpm --silent tsx scripts/github/get-release.ts)
          if [[ $OUTPUT == "RELEASE" ]];
          then
            echo "release=true" >> $GITHUB_OUTPUT
          elif [[ $OUTPUT == "PRE_RELEASE" ]];
          then
            echo "preRelease=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_COMMITISH: ${{ github.event.release.target_commitish }}
          GITHUB_PRE_RELEASE: ${{ github.event.release.prerelease }}

      - name: ↔ Extract tag name
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        id: extractTag

      - name: 🏷 Get and Set Package Version on Env
        id: getVersion
        env:
          RELEASE: ${{ steps.releaseCheck.outputs.release }}
          PRE_RELEASE: ${{ steps.releaseCheck.outputs.preRelease }}
          TAG: ${{ steps.extractTag.outputs.tag }}
        run: |
          OUTPUT=$(pnpm --silent tsx scripts/github/package-version.ts)
          echo "version=$OUTPUT" >> $GITHUB_OUTPUT

      - name: 🌳 Log Valid Version
        env:
          VALID_SEMVER_VERSION: ${{ steps.getVersion.outputs.version }}
        run: echo "$VALID_SEMVER_VERSION"
