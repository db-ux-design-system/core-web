# Auto-resolvable conflict patterns
#
# Files matching these glob patterns are resolved with "theirs" (accept the
# incoming main branch version) when a merge conflict occurs. This is safe
# for files that get regenerated by CI anyway — keeping the branch mergeable
# without manual intervention.
#
# Strategy:
#   theirs — accept the version from the branch being merged in (usually main)
#   ours   — keep the version on the current branch
#
# Add new entries as needed. More specific patterns should come first.

rules:
  # Playwright visual snapshots — regenerated by CI after every merge
  - paths: "__snapshots__/**/*.png"
    strategy: "theirs"

  # Playwright aria snapshots — regenerated by CI
  - paths: "__snapshots__/**/*.txt"
    strategy: "theirs"
