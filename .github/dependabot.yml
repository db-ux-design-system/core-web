---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
      time: "23:00"
      timezone: "Europe/Berlin"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Daily: Check minor and patch updates
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "daily"
      time: "23:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    ignore:
      # angular: we update the major version manually
      - dependency-name: "@angular*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit*"
        update-types: ["version-update:semver-major"]
        # react: we update the major version manually
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      # We currently need to ignore eslint, because we need to update Angular first of all (specifically the currently installed version of @angular-eslint/template-parser still relies on eslint < 10)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # We currently need to ignore this for the actual (LTS) Angular version
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
      # DB theme packages are handled by Renovate (see .github/renovate.json)
      - dependency-name: "@db-ux/db-theme*"
    pull-request-branch-name:
      separator: "-"
    # https://github.com/dependabot/dependabot-core/issues/5226#issuecomment-1179434437
    versioning-strategy: increase
    groups:
      # Major framework dependencies - group by framework for better review
      angular:
        patterns:
          - "@angular*"
          - "@angular-devkit*"
          - "ng-packagr"
        update-types:
          - "patch"
          - "minor"
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "patch"
          - "minor"
      # Testing frameworks
      playwright:
        patterns:
          - "@playwright*"
          - "playwright*"
      # Linting and formatting tools
      eslint:
        patterns:
          - "eslint*"
          - "@eslint*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint*"
          - "typescript-eslint*"
      stylelint:
        patterns:
          - "stylelint*"
          - "@double-great/stylelint-a11y"
      prettier:
        patterns:
          - "prettier*"
      # Build tools and bundlers
      vite:
        patterns:
          - "vite*"
      # Test tools
      vitest:
        patterns:
          - "vitest"
          - "@vitest*"
      # MCP SDK: all v2 packages share one version number and pin
      # @modelcontextprotocol/core to an exact version, so a one-sided bump
      # resolves two incompatible core copies into the tree.
      #
      # zod belongs in the same group: the SDK declares "zod": "^4.2.0" while
      # @db-ux/mcp-server pins it exactly. Bumping only one side lets the
      # resolver put a second zod copy into the bundle, and the tool schemas
      # must come from the same copy the SDK converts them with.
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol*"
          - "zod"
      # Development tools
      typescript:
        patterns:
          - "typescript"
          - "tsx"
          - "tslib"
      # Other grouped dependencies
      builder.io:
        patterns:
          - "@builder.io/mitosis*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook*"
          - "*-storybook"
      inquirer:
        patterns:
          - "@inquirer/*"
          - "inquirer"
      mdx-js:
        patterns:
          - "@mdx-js/*"
      guidepup:
        patterns:
          - "@guidepup/*"
      next:
        patterns:
          - "@next*"
          - "eslint-config-next"
          - "next"
      tanstack:
        patterns:
          - "@tanstack/*"
      changesets:
        patterns:
          - "@changesets/*"
      # Automatically group all patch updates to reduce PR noise
      patch-dependencies:
        update-types:
          - "patch"
        patterns:
          - "*"
