<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>storybook - Storybook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    
    <style>
      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-regular.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-italic.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito Sans';
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url('./sb-common-assets/nunito-sans-bold-italic.woff2') format('woff2');
      }
    </style>

    <link href="./sb-manager/runtime.js" rel="modulepreload" />

    
    <link href="./sb-addons/storybook-core-server-presets-0/common-manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/docs-1/manager-bundle.js" rel="modulepreload" />
    
    <link href="./sb-addons/storybook-2/manager-bundle.js" rel="modulepreload" />
      <!--
	PROTOTYPE – favicon and fonts of the Storybook UI.
	Copied into `.storybook/manager-head.html` of every Storybook by sync.ts.
	`brand/` is a static directory (main.ts): the design system logo, and in the
	composition Storybook the DB Theme fonts. Without the fonts, the UI falls
	back to helvetica and arial.
-->
<link type="image/svg+xml" href="./brand/images/logo.svg" rel="icon" />
<style>
	@font-face {
		font-family: "DB Neo Screen Sans";
		font-weight: 400;
		font-display: swap;
		src: url("./brand/fonts/dbneoscreensans-regular.woff2") format("woff2");
	}

	/* "Storybook" in the sidebar header (theme.ts). */
	@font-face {
		font-family: "DB Neo Screen Head";
		font-weight: 300;
		font-display: swap;
		src: url("./brand/fonts/dbneoscreenhead-light.woff2") format("woff2");
	}

	@font-face {
		font-family: "DB Neo Screen Sans";
		font-weight: 700;
		font-display: swap;
		src: url("./brand/fonts/dbneoscreensans-bold.woff2") format("woff2");
	}
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "actions": true,
  "argTypeTargetsV7": true,
  "babelRemoveBugfixes": false,
  "backgrounds": true,
  "changeDetection": true,
  "componentsManifest": false,
  "controls": true,
  "disallowImplicitActionsInRenderV8": true,
  "highlight": true,
  "interactions": true,
  "legacyDecoratorFileOrder": false,
  "measure": true,
  "outline": true,
  "menuOnboardingChecklist": true,
  "sidebarOnboardingChecklist": true,
  "viewport": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
          window['DOCGEN_STORY_PREPARED'] = false;
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "vue3-vite";
        
      
        
          window['STORYBOOK_RENDERER'] = "vue3";
        
      
        
      
    </script>
    

    <script type="module">
      import './sb-manager/globals-runtime.js';

      
        import './sb-addons/storybook-core-server-presets-0/common-manager-bundle.js';
      
        import './sb-addons/docs-1/manager-bundle.js';
      
        import './sb-addons/storybook-2/manager-bundle.js';
      

      import './sb-manager/runtime.js';
    </script>
  </body>
</html>
