-->

<style data-db-theme="manager">
	:root {
		--db-sb-brand: #ec0016;
		--db-sb-on-brand: #ffffff;
		--db-sb-background: #ffffff;
		--db-sb-background-level-2: #f3f3f5;
		--db-sb-background-level-3: #edeef0;
		--db-sb-item-hovered: rgba(90, 94, 104, 0.24);
		--db-sb-item-pressed: rgba(90, 94, 104, 0.32);
		--db-sb-indicator: #ef0016;
		--db-sb-text: #16181b;
		--db-sb-text-muted: #5a5e68;
		--db-sb-border: #c3c7ce;
		--db-sb-indicator-width: 4px;
		--db-sb-border-width: 1px;
		--db-sb-radius: 0px;
	}

	/* cspell:ignore nodetype inlines */

	/*
 * CSS escape hatches of the Storybook UI (sidebar, toolbar).
 *
 * Storybook's theme API (theme.ts) is narrow by design; for anything else
 * Storybook documents style tags in `.storybook/manager-head.html` that target
 * its class names, "at your own risk"
 * (https://storybook.js.org/docs/configure/user-interface/theming#css-escape-hatches).
 * sync.ts inlines this file into `manager-head.html` of every Storybook,
 * together with the `--db-sb-*` values from theme-values.json: the manager
 * does not load the design system CSS.
 *
 * Storybook's inner HTML can change with any release. theme.spec.ts checks
 * that every selector used here still matches.
 */

	/*
 * Hidden controls without an API:
 * - "Extra actions" (globe) of the framework refs: only a status popover. The
 *   version dropdown next to it stays.
 * - "Expand/collapse all" next to every section heading (Foundations,
 *   Components, also inside the refs). The heading itself still toggles.
 * - Tag filter button in the search field. The label reads "N active tag
 *   filter(s)" while filters are set.
 */
	[data-action="toggle-indicator"],
	[data-action="expand-all"],
	button:is(
		[aria-label="Tag filters"],
		[aria-label$=" active tag filter"],
		[aria-label$=" active tag filters"]
	) {
		display: none !important;
	}

	/*
 * Sidebar in the style of the control panel navigation
 * (packages/components/src/styles/internal/_navigation-item.scss and
 * _indicator.scss):
 * - level 1 background with a border to the content
 * - items with a transparent background, the hover and pressed overlay
 * - the active item in bold with the vertical brand indicator, no fill
 * - icons in the text color (icon passing uses currentcolor)
 *
 * The theme API cannot set these: Storybook fills the selected item with
 * `colorSecondary` and hard-codes the icon colors per node type.
 * `!important` overrides the generated Storybook styles, whose specificity
 * varies.
 */
	.sidebar-container {
		border-inline-end: var(--db-sb-border-width) solid var(--db-sb-border);
	}

	/*
 * Section headings (FOUNDATIONS) like the framework ref headings: bold,
 * regular case, with the separator line above. The highlight colors of
 * Storybook (pink fill, red text) are replaced with the hover overlay.
 * Spacing measured on the ref headings: 20px above, 45px high (the button
 * line is 2px taller than the ref title, hence 15px/11px).
 */
	.sidebar-subheading[data-nodetype="root"] {
		border-block-start: var(--db-sb-border-width) solid var(--db-sb-border);
		margin-block: 20px 0 !important;
		padding-block: 15px 11px;
		background: transparent !important;
	}

	.sidebar-subheading[data-nodetype="root"]
		> button[data-action="collapse-root"] {
		block-size: auto;
		min-block-size: 0;
		padding-block: 0;
		line-height: inherit;
		font-size: 14px;
		font-weight: 700;
		text-transform: none;
		letter-spacing: normal;
		color: var(--db-sb-text) !important;
		background: transparent !important;
	}

	.sidebar-subheading[data-nodetype="root"]
		> button[data-action="collapse-root"]:hover {
		background: var(--db-sb-item-hovered) !important;
	}

	.sidebar-item[data-nodetype] {
		position: relative;
		border-radius: var(--db-sb-radius) !important;
	}

	.sidebar-item[data-nodetype]:not([data-selected="true"]):hover {
		background: var(--db-sb-item-hovered) !important;
	}

	.sidebar-item[data-nodetype]:not([data-selected="true"]):active {
		background: var(--db-sb-item-pressed) !important;
	}

	.sidebar-item[data-nodetype][data-selected="true"] {
		background: transparent !important;
		color: var(--db-sb-text) !important;
	}

	.sidebar-item[data-nodetype][data-selected="true"]:hover {
		background: var(--db-sb-item-hovered) !important;
	}

	/*
 * The control panel places the indicator outside the item; the sidebar
 * scroll container would clip it there, so it sits on the inner edge.
 */
	.sidebar-item[data-nodetype][data-selected="true"]::after {
		content: "";
		position: absolute;
		inset-block: 0;
		inset-inline-start: 0;
		inline-size: var(--db-sb-indicator-width);
		border-radius: var(--db-sb-radius);
		background: var(--db-sb-indicator);
	}

	.sidebar-item[data-nodetype] svg[type] {
		color: currentcolor !important;
	}

	/*
 * Toolbar (`.sb-bar`) and settings button (gear in the sidebar header) like
 * the sidebar items: text color, the hover and pressed overlay, and for an
 * active tool (a switch with `aria-checked="true"`, e.g. the measure tool)
 * the brand indicator below it, like the horizontal control panel. Storybook
 * fills active tools and set globals (the "Mode" select) with a brand tint
 * instead; the select keeps the text color, its value is its label.
 */
	.sb-bar button,
	button[aria-label="Settings"] {
		position: relative;
		border-radius: var(--db-sb-radius) !important;
		color: var(--db-sb-text) !important;
		background: transparent !important;
	}

	.sb-bar button:hover,
	button[aria-label="Settings"]:hover {
		background: var(--db-sb-item-hovered) !important;
	}

	.sb-bar button:active,
	button[aria-label="Settings"]:active {
		background: var(--db-sb-item-pressed) !important;
	}

	.sb-bar button[role="switch"][aria-checked="true"]::after {
		content: "";
		position: absolute;
		inset-inline: 0;
		inset-block-end: 0;
		block-size: var(--db-sb-indicator-width);
		border-radius: var(--db-sb-radius);
		background: var(--db-sb-indicator);
	}

	/* Forced colors: the indicator background disappears, draw a border. */
	@media (forced-colors: active) {
		.sidebar-item[data-nodetype][data-selected="true"]::after {
			border: var(--db-sb-indicator-width) solid CanvasText;
		}

		.sb-bar button[role="switch"][aria-checked="true"]::after {
			border-block-end: var(--db-sb-indicator-width) solid CanvasText;
		}
	}
</style>
