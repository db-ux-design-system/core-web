<app-form-wrapper
	[control]="formControl.value"
	[model]="ngModel"
	[plain]="plain"
	[signalForms]="signalForm.value().value()"
>
	<fieldset>
		<legend>Different form approaches</legend>
		<db-input
			(change)="handlePlainChange($event)"
			[value]="plain"
			icon="x_placeholder"
			label="Plain"
			message="Description"
			name="input-name"
			placeholder="Placeholder"
		/>
		<db-input
			[(ngModel)]="ngModel"
			icon="x_placeholder"
			label="ngModel"
			message="Description"
			name="input-name"
			placeholder="Placeholder"
		/>
		<db-input
			[formControl]="formControl"
			icon="x_placeholder"
			label="formControl"
			message="Description"
			name="input-name"
			placeholder="Placeholder"
		/>
		<app-signal-forms-input [formField]="signalForm.value" />
	</fieldset>
</app-form-wrapper>
<!--
	Regression fixture for
	https://github.com/db-ux-design-system/core-web/issues/6147 -- a consumer
	resets a field by binding `value` to `undefined`.
-->
<fieldset>
	<legend>Reset to undefined</legend>
	<db-input [value]="undefinedValue" label="Undefined reset" />
	<db-button (click)="unsetValue()" data-testid="unset-value-button">
		Set value to undefined
	</db-button>
</fieldset>
