packages:
  - "packages/*"
  - "output/*"
  - "showcases/*"
  - "storybooks/*"
  - "docs"
  - "scripts"
  - "figma-code-connect/*"

allowBuilds:
  "@compodoc/compodoc": false
  "@db-ux/db-theme": true
  "@db-ux/db-theme-fonts": true
  "@db-ux/db-theme-icons": true
  "@db-ux/db-theme-illustrative-icons": true
  "@parcel/watcher": false
  accessibility-checker: false
  chromedriver: false
  core-js: false
  esbuild: true
  ffmpeg-static: true
  lmdb: false
  msgpackr-extract: false
  puppeteer: true
  rs-module-lexer: false
  sharp: false
  svelte-preprocess: false
  ttf2woff2: false
  unrs-resolver: false

engineStrict: true

minimumReleaseAgeExclude:
  - "@db-ux/db-theme"
  - "@db-ux/db-theme-fonts"
  - "@db-ux/db-theme-icons"
  - "@db-ux/db-theme-illustrative-icons"
  - got@11.8.5
  - marked@0.7.0 || 4.0.10
  - semver-regex@3.1.3 || 3.1.4
  - svelte@4.2.19 || 5.51.5 || 5.53.5 || 5.55.7
  - esbuild@0.24.3
  - html-minifier@4.0.1
  - file-type@21.3.1
  - uuid@11.1.1
  - "@angular/compiler@18.2.15 || 19.2.26"
  - "@babel/core@7.29.1"
  - webpack-dev-server@5.2.6
  - "@hono/node-server@2.0.5"
  - js-yaml@3.15.1 || 4.3.1 || 5.2.2
  - react-router@8.3.0
  - postcss@8.5.18 || 8.5.23
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.9
  - undici@6.28.0 || 7.29.0
  - fast-uri@3.1.5
  - image-size@2.0.3
  - nanoid@3.3.18

overrides:
  # PostCSS patch releases ship type-incompatible .d.ts files; pnpm isolates
  # different patches into separate node_modules paths, breaking TS compilation.
  # Force the entire dependency graph to resolve a single copy via catalog.
  postcss: "catalog:"
  # The Angular toolchain (@angular-devkit/build-angular -> webpack-subresource-
  # integrity -> html-webpack-plugin -> webpack) resolved its webpack/esbuild
  # peers non-deterministically: webpack against either Angular's own 5.105.2 or
  # the unrelated Storybook/Nuxt/Next webpack@5.111.0, and esbuild (an optional
  # peer of webpack) against 0.28.1 vs 0.28.2. That produced multiple peer-hash
  # variants of the same build-angular version, which `pnpm audit --fix=update`
  # rewrote on every Dependabot PR (99-audit-fix-dependabot.yml). We collapse it
  # deterministically with two minimal, scoped overrides:
  #   1. Pin the html-webpack-plugin webpack edge to Angular's 5.105.2 so it never
  #      drifts onto the Storybook webpack. Scoped, so both top-level webpack
  #      copies stay intact.
  #   2. Pin the whole esbuild 0.28.x line to a single patch (0.28.2, the version
  #      `audit --fix` prefers, so the result is idempotent). The version-range
  #      selector leaves the unrelated esbuild 0.12.x and 0.25.x copies untouched.
  "html-webpack-plugin>webpack": "catalog:"
  "esbuild@~0.28.0": 0.28.2

catalog:
  postcss: 8.5.28
  webpack: 5.111.1

saveExact: true
