packages:
  - "packages/*"
  - "output/*"
  - "showcases/*"
  - "storybooks/*"
  - "docs"
  - "scripts"
  - "figma-code-connect/*"

allowBuilds:
  "@compodoc/compodoc": false
  "@db-ux/db-theme": true
  "@db-ux/db-theme-fonts": true
  "@db-ux/db-theme-icons": true
  "@db-ux/db-theme-illustrative-icons": true
  "@parcel/watcher": false
  accessibility-checker: false
  chromedriver: false
  core-js: false
  esbuild: true
  ffmpeg-static: true
  lmdb: false
  msgpackr-extract: false
  puppeteer: true
  rs-module-lexer: false
  sharp: false
  svelte-preprocess: false
  ttf2woff2: false
  unrs-resolver: false

engineStrict: true

minimumReleaseAgeExclude:
  - "@db-ux/db-theme"
  - "@db-ux/db-theme-fonts"
  - "@db-ux/db-theme-icons"
  - "@db-ux/db-theme-illustrative-icons"
  - got@11.8.5
  - marked@0.7.0 || 4.0.10
  - semver-regex@3.1.3 || 3.1.4
  - svelte@4.2.19 || 5.51.5 || 5.53.5 || 5.55.7
  - esbuild@0.24.3
  - html-minifier@4.0.1
  - sassdoc-extras@3.0.1
  - file-type@21.3.1
  - uuid@11.1.1
  - "@angular/compiler@18.2.15 || 19.2.26"
  - "@babel/core@7.29.1"
  - webpack-dev-server@5.2.6
  - "@hono/node-server@2.0.5"
  - react-router@8.3.0
  - postcss@8.5.18 || 8.5.23
  - brace-expansion@1.1.17 || 1.1.18
  - undici@7.29.0

saveExact: true
