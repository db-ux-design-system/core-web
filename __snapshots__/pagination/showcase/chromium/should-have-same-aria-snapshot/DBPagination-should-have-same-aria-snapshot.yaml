  - link "Link"
  - text: hrefPattern turns the pages into anchors - deep linkable and usable without JavaScript
  - navigation "Linked pagination":
    - list:
      - listitem:
        - link "Previous page"
      - listitem:
        - link "Page 1 of 10"
          - text: "1"
      - listitem:
        - link "Page 4 of 10"
          - text: "4"
      - listitem:
        - link "Page 5 of 10"
          - text: "5"
      - listitem:
        - link "Page 6 of 10"
          - text: "6"
      - listitem:
        - link "Page 10 of 10"
          - text: "10"
      - listitem:
        - link "Next page"
  - text: At the boundaries previous and next stay disabled buttons, because there is no page to link to
  - navigation "Linked boundary pagination":
    - list:
      - listitem:
        - button "Previous page" [disabled]
      - listitem:
        - link "Page 1 of 10"
          - text: "1"
      - listitem:
        - link "Page 2 of 10"
          - text: "2"
      - listitem:
        - link "Page 3 of 10"
          - text: "3"
      - listitem:
        - link "Page 4 of 10"
          - text: "4"
      - listitem:
        - link "Page 5 of 10"
          - text: "5"
      - listitem:
        - link "Page 10 of 10"
          - text: "10"
      - listitem:
        - link "Next page"
  - link "Collapsing"
  - text: Below the sm breakpoint the pages next to the current one give way - resize the window to see it
  - navigation "Collapsing pagination":
    - list:
      - listitem:
        - button "Previous page"
      - listitem:
        - button "Page 1 of 10000": "1"
      - listitem:
        - button "Page 4999 of 10000": "4999"
      - listitem:
        - button "Page 5000 of 10000": "5000"
      - listitem:
        - button "Page 5001 of 10000": "5001"
      - listitem:
        - button "Page 10000 of 10000": "10000"
      - listitem:
        - button "Next page"
  - text: A list this short is already the collapsed layout, so it stays as it is
  - navigation "Collapsing short list pagination":
