  - link "Position"
  - text: (Default) Start - previous is disabled
  - navigation "Start position pagination":
    - list:
      - listitem:
        - button "Previous page" [disabled]
      - listitem:
        - button "Page 1 of 10": "1"
      - listitem:
        - button "Page 2 of 10": "2"
      - listitem:
        - button "Page 3 of 10": "3"
      - listitem:
